plugins {
    id 'org.asciidoctor.jvm.convert' version '4.0.2'
    id 'groovy'
    id 'maven-publish'
}

version '1.1.0'
group 'maxmoto1702'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.codehaus.groovy:groovy-all:2.4.6'
    implementation 'org.apache.poi:poi:3.14'
    implementation 'org.apache.poi:poi-ooxml:3.14'
    implementation 'org.slf4j:slf4j-api:1.7.12'

    testImplementation 'org.apache.logging.log4j:log4j-api:2.3'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.3'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.3'
    testImplementation 'org.slf4j:jcl-over-slf4j:1.7.6'
    testImplementation group: 'org.spockframework', name: 'spock-core', version: '1.0-groovy-2.4'
}

asciidoctor {
    logDocuments = true
    outputOptions {
        backends = ['html5']
    }
    attributes = [
            'toc'      : 'left',
            'sourceDir': "${projectDir}/src/main/groovy",
            'version': "$project.version",
            'groupId': "$project.group",
            'artifactId': "$project.name",
    ]
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${buildDir}/repo")
        }
    }
}
