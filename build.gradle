plugins {
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
    id 'groovy'
    id 'maven-publish'
}

version '1.1.0'
group 'maxmoto1702'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:5.0.4'
    implementation 'org.apache.poi:poi:5.5.1'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    implementation 'org.slf4j:slf4j-api:2.0.17'

    testImplementation 'org.apache.logging.log4j:log4j-api:2.25.3'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.25.3'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.25.3'
    testImplementation 'org.slf4j:jcl-over-slf4j:2.0.17'
    testImplementation group: 'org.spockframework', name: 'spock-core', version: '2.4-groovy-5.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

asciidoctor {
    logDocuments = true
    outputOptions {
        backends = ['html5']
    }
    attributes = [
            'toc'      : 'left',
            'sourceDir': "${projectDir}/src/main/groovy",
            'version': "$project.version",
            'groupId': "$project.group",
            'artifactId': "$project.name",
    ]
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${buildDir}/repo")
        }
    }
}
